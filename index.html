<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المروج</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { background: #f1f5f9; font-family: 'Cairo', sans-serif; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-page" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-[2rem] shadow-2xl w-full max-w-sm border border-slate-100 text-center">
            <div class="bg-blue-600 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-blue-200">
                <i class="fas fa-chart-line text-white text-3xl"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 mb-2">لوحة تحكم المروج</h2>
            <p class="text-slate-400 mb-8 text-sm">سجل دخول لمتابعة أرباحك</p>
            <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-4 mb-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 text-center">
            <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-4 mb-6 rounded-2xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 text-center">
            <button id="loginBtn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-blue-700 transition-all">دخول النظام</button>
        </div>
    </div>

    <div id="dashboard" class="hidden min-h-screen">
        <div class="bg-white p-5 shadow-sm flex justify-between items-center px-8 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg text-sm"><i class="fas fa-briefcase"></i></div>
                <span class="font-black text-slate-700 text-lg">لوحة تحكم المروج</span>
            </div>
            <button id="logoutBtn" class="text-red-500 font-bold bg-red-50 px-4 py-2 rounded-xl text-sm">خروج</button>
        </div>

        <div class="p-6 max-w-md mx-auto space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border-b-4 border-emerald-500">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-2">أرباح اليوم</p>
                    <h3 id="today-earnings" class="text-2xl font-black text-slate-800">$0.00</h3>
                </div>
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border-b-4 border-blue-500">
                    <p class="text-[10px] text-slate-400 font-bold uppercase mb-2">الإجمالي</p>
                    <h3 id="total-earnings" class="text-2xl font-black text-slate-800">$0.00</h3>
                </div>
            </div>

            <div class="bg-white p-8 rounded-[2rem] shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-xs font-bold uppercase">النقرات الحالية</p>
                    <h3 id="clicks" class="text-4xl font-black text-slate-800 mt-2">0</h3>
                </div>
                <div class="bg-blue-50 p-5 rounded-3xl text-blue-600">
                    <i class="fas fa-mouse-pointer text-3xl"></i>
                </div>
            </div>

            <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                <h4 class="font-bold text-slate-800 mb-6 flex items-center gap-2 text-lg">
                    <i class="fas fa-money-check-alt text-blue-600"></i> سحب الأرباح
                </h4>
                <div class="space-y-4">
                    <select id="withdraw-method" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none text-sm font-bold appearance-none">
                        <option value="zain_cash">زين كاش (ZainCash)</option>
                        <option value="bank">حوالة بنكية</option>
                        <option value="usdt">USDT</option>
                    </select>
                    <input type="number" id="withdraw-amount" placeholder="أدخل المبلغ $" class="w-full p-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none text-center font-bold">
                    <button onclick="requestWithdraw()" class="w-full bg-slate-800 text-white font-black py-4 rounded-2xl hover:bg-black transition-all">إرسال طلب السحب</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBf5F5vhbpu8fjp4rS9M-Uj-gUPR88qbds",
          authDomain: "my-site-6f7ff.firebaseapp.com",
          databaseURL: "https://my-site-6f7ff-default-rtdb.firebaseio.com",
          projectId: "my-site-6f7ff",
          storageBucket: "my-site-6f7ff.firebasestorage.app",
          messagingSenderId: "171038692625",
          appId: "1:171038692625:web:4f5d02855d65aef7a768b0"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadData();
            } else {
                document.getElementById('login-page').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
            }
        });

        document.getElementById('loginBtn').onclick = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, pass).catch(err => alert("خطأ: " + err.message));
        };

        document.getElementById('logoutBtn').onclick = () => auth.signOut();

        function loadData() {
            // القراءة من مسار عام "promoter_data"
            db.ref('promoter_data').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('total-earnings').innerText = '$' + (data.earnings || '0.00');
                    document.getElementById('today-earnings').innerText = '$' + (data.today_earnings || '0.00');
                    document.getElementById('clicks').innerText = data.clicks || '0';
                }
            });
        }

        function requestWithdraw() {
            const amount = document.getElementById('withdraw-amount').value;
